<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)" />

    <!-- 검색엔진 인덱싱 차단: 링크를 받은 하객만 열람, 구글 등 검색 미노출 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- ─── 공유 미리보기 (Open Graph / Twitter) ───
         ⚠️ 카카오톡·페이스북 크롤러는 '절대 URL'만 인식합니다.
         배포 후 아래 og:url / og:image / twitter:image 의
         https://jjy4880.github.io/wedding-invitation 부분을
         실제 배포 주소로 바꿔주세요. (localhost 는 미리보기 검증 불가) -->
    <title>지용 ♡ 은미 결혼합니다</title>
    <meta
      name="description"
      content="2026년 9월 12일 토요일 오후 5시 30분 · 더컨벤션 송파문정에서 저희 결혼식에 초대합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="지용 ♡ 은미 결혼합니다" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="지용 ♡ 은미 결혼합니다" />
    <meta
      property="og:description"
      content="2026년 9월 12일 토요일 오후 5시 30분 · 더컨벤션 송파문정"
    />
    <meta property="og:url" content="https://jjy4880.github.io/wedding-invitation/" />
    <meta
      property="og:image"
      content="https://jjy4880.github.io/wedding-invitation/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="지용 ♡ 은미 결혼합니다" />
    <meta
      name="twitter:description"
      content="2026년 9월 12일 토요일 오후 5시 30분 · 더컨벤션 송파문정"
    />
    <meta
      name="twitter:image"
      content="https://jjy4880.github.io/wedding-invitation/og-image.jpg"
    />

    <!-- 폰트: Pretendard(본문) + 나눔명조(감성 세리프). 인터넷 연결 시 로드됩니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
